<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joli Jump - ජෝලි ජම්ප් 🚀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        /* 🎮 Game Window */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: 85vh;
            max-height: 550px;
            background: linear-gradient(to bottom, #1e1b4b, #311042);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #f43f5e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 📊 Score Dashboard */
        .score-board {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #facc15;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* 🎬 Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 20;
        }

        .overlay.hidden { display: none; }
        .overlay h1 { font-size: 32px; color: #facc15; margin-bottom: 10px; }
        .overlay p { font-size: 15px; margin-bottom: 25px; opacity: 0.8; line-height: 1.6; }

        .btn {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
        }

        /* 📱 Mobile Controller Layer */
        .controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            z-index: 5;
        }
        .touch-btn {
            flex: 1;
            height: 100%;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="score-board">Score: <span id="scoreText">0</span></div>
        <canvas id="gameCanvas" width="380" height="550"></canvas>

        <!-- Touch Areas for Mobile -->
        <div class="controls">
            <div class="touch-btn" id="leftTouch"></div>
            <div class="touch-btn" id="rightTouch"></div>
        </div>

        <!-- START SCREEN -->
        <div class="overlay" id="startScreen">
            <h1>Joli Jump! 🟡✨</h1>
            <p>බෝලය බිම වැටෙන්න නොදී තට්ටු මතින් ඉහළටම යන්න!<br><br>
            **ක්‍රීඩා කරන්නේ මෙහෙමයි:**<br>
            📱 ෆෝන් එකෙන්: වම් / දකුණු පැති ටච් කරන්න.<br>
            💻 කම්පියුටරයෙන්: Left / Right Arrow කීස් ඔබන්න.</p>
            <button class="btn" onclick="startGame()">Start Game 🚀</button>
        </div>

        <!-- GAME OVER SCREEN -->
        <div class="overlay hidden" id="gameOverScreen">
            <h1 style="color:#ef4444;">Game Over! 😢</h1>
            <p>අයියෝ.. බෝලය පහළට වැටුණා.<br>ඔබේ ලකුණු ප්‍රමාණය: <span id="finalScore" style="color:#facc15; font-weight:bold; font-size:18px;">0</span></p>
            <button class="btn" style="background:#0ea5e9;" onclick="startGame()">Try Again 🔄</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const finalScore = document.getElementById('finalScore');
        
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        let gameActive = false;
        let score = 0;
        let cameraY = 0;

        // 🟡 Player Object
        let player = {
            x: 190, y: 400,
            radius: 12,
            vx: 0, vy: 0,
            jumpForce: -9,
            gravity: 0.3
        };

        // 🟩 Platforms Array
        let platforms = [];
        const platformCount = 7;

        let moveLeft = false;
        let moveRight = false;

        // Keyboard Inputs (PC)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = true;
            if (e.key === 'ArrowRight') moveRight = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = false;
            if (e.key === 'ArrowRight') moveRight = false;
        });

        // Touch Inputs (Mobile)
        document.getElementById('leftTouch').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
        document.getElementById('leftTouch').addEventListener('touchend', () => moveLeft = false);
        document.getElementById('rightTouch').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
        document.getElementById('rightTouch').addEventListener('touchend', () => moveRight = false);

        // Game ආරම්භ කිරීම
        function startGame() {
            score = 0;
            cameraY = 0;
            scoreText.innerText = score;
            
            player.x = 190;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;

            platforms = [];
            // පළමු තට්ටුව කෙලින්ම ක්‍රීඩකයාට යටින්
            platforms.push({ x: 140, y: 450, width: 100, height: 12 });

            // ඉතිරි තට්ටු සෑදීම
            for (let i = 1; i < platformCount; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - 70),
                    y: 450 - (i * 80),
                    width: 70,
                    height: 12
                });
            }

            gameActive = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            requestAnimationFrame(updateGame);
        }

        function updateGame() {
            if (!gameActive) return;

            // 1. Player Movement (වමට/දකුණට)
            if (moveLeft) player.vx = -4.5;
            else if (moveRight) player.vx = 4.5;
            else player.vx = 0;

            player.x += player.vx;
            player.vy += player.gravity;
            player.y += player.vy;

            // Screen එක දෙපැත්තෙන් මාරු වීම (Wrap around)
            if (player.x < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = 0;

            // 2. Camera Scroll Logic (ක්‍රීඩකයා උඩට යද්දී කැමරාව උඩට යෑම)
            if (player.y < canvas.height / 2) {
                let diff = (canvas.height / 2) - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff); // යන දුර අනුව ලකුණු වැඩි වේ
                scoreText.innerText = score;

                platforms.forEach(plat => {
                    plat.y += diff;
                    // තට්ටුවක් Screen එකෙන් පහළට ගියොත් නැවත උඩින් රීසෙට් කිරීම
                    if (plat.y > canvas.height) {
                        plat.y = 0;
                        plat.x = Math.random() * (canvas.width - plat.width);
                    }
                });
            }

            // 3. Collision (තට්ටු මත පතිත වීම - වැටෙද්දී පමණක්)
            if (player.vy > 0) {
                platforms.forEach(plat => {
                    if (player.x + 8 > plat.x && 
                        player.x - 8 < plat.x + plat.width &&
                        player.y + player.radius >= plat.y && 
                        player.y + player.radius <= plat.y + plat.height) {
                        player.vy = player.jumpForce; // නැවත ඉහළට පැනීම
                    }
                });
            }

            // 4. Game Over Condition (ක්‍රීඩකයා පහළටම වැටුණොත්)
            if (player.y - player.radius > canvas.height) {
                gameActive = false;
                finalScore.innerText = score;
                gameOverScreen.classList.remove('hidden');
                return;
            }

            // 🎨 Drawing (ඇඳීමේ කොටස)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // තට්ටු ඇඳීම (Platforms)
            ctx.fillStyle = '#10b981';
            platforms.forEach(plat => {
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            });

            // බෝලය ඇඳීම (Player)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.closePath();

            requestAnimationFrame(updateGame);
        }
    </script>
</body>
</html>
